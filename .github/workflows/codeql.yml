# CodeQL — S6 / ENG-132 (SAST every PR)
# Upload to GitHub Security tab requires code scanning / GHAS on private repos.
# We always analyze + gate on SARIF findings so CI still blocks without GHAS.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly backup scan (Mondays 06:00 UTC)
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
          upload: never
          output: ${{ runner.temp }}/codeql-sarif

      - name: Gate on CodeQL SARIF findings
        run: node scripts/codeql-sarif-gate.mjs "${{ runner.temp }}/codeql-sarif"
