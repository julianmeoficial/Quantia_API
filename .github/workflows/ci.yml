name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_ENV: test
  PORT: 3000
  DATABASE_URL: postgresql://quantia:quantia@localhost:5432/quantia
  DIRECT_URL: postgresql://quantia:quantia@localhost:5432/quantia
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: quantia-ci-access-secret-change-me-32chars
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_SECRET: quantia-ci-refresh-secret-change-me-32chars
  JWT_REFRESH_TTL: 7d

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quantia
          POSTGRES_PASSWORD: quantia
          POSTGRES_DB: quantia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantia -d quantia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: E2E tests
        run: npm run test:e2e

      - name: Docker build
        run: docker build -t quantia-api:ci .
