name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_ENV: test
  APP_ENV: test
  PORT: 3000
  DATABASE_URL: postgresql://quantia:quantia@localhost:5432/quantia
  DIRECT_URL: postgresql://quantia:quantia@localhost:5432/quantia
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: quantia-ci-access-secret-change-me-32chars
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_SECRET: quantia-ci-refresh-secret-change-me-32chars
  JWT_REFRESH_TTL: 7d
  CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
  CORS_VERCEL_PREVIEW: false
  NOTION_TOKEN: ntn_ci_token_placeholder
  NOTION_WEBHOOK_SECRET: whsec_ci_webhook_secret
  NOTION_VERSION: 2025-09-03
  NOTION_RATE_LIMIT_RPS: 3
  NOTION_SYNC_MAX_ATTEMPTS: 5
  NOTION_WEBHOOK_MAX_SKEW_SECONDS: 300
  NOTION_SANDBOX_PAGE_ID: 3df8b2d8-659c-808d-890f-d25b0213aacd
  NOTION_DB_USERS: 182336f1-ce31-4495-bd88-f168bf3aa3bc
  NOTION_DS_USERS: 6a429964-8f61-43c9-952d-1e68fb3e578c
  NOTION_DB_PROJECTS: 5c857af6-f89c-41a4-9ed6-e59af6a53454
  NOTION_DS_PROJECTS: f34435f4-95c6-4e98-b808-c2cc93a563ca
  NOTION_DB_TASKS: 9d0bd14e-6be8-4f99-9de6-8375f8600770
  NOTION_DS_TASKS: f5f6ecfa-e866-4234-b481-19849da9944f
  NOTION_DB_PROGRESS: 950366a7-30f3-4f00-9094-a2d1af9209d9
  NOTION_DS_PROGRESS: 59238cc9-6691-414e-af53-bcd9648e9897
  NOTION_DB_SYNC_LOG: a1c62fe1-d457-4a7d-b16a-c360786b7520
  NOTION_DS_SYNC_LOG: f3e4e43d-185a-41c2-9eb9-7bf8303892b8
  SUPABASE_URL: https://example.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: supabase_ci_service_role_key
  SUPABASE_STORAGE_BUCKET_DOCUMENTS: quantia-documents
  SUPABASE_STORAGE_BUCKET_REPORTS: quantia-reports
  STORAGE_SIGNED_URL_TTL_SECONDS: 300
  STORAGE_MAX_UPLOAD_BYTES: 26214400
  STORAGE_ALLOWED_MIME: application/pdf,image/png,image/jpeg,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  THROTTLE_DEFAULT_TTL_MS: 60000
  THROTTLE_DEFAULT_LIMIT: 10000
  THROTTLE_AUTH_TTL_MS: 60000
  THROTTLE_AUTH_LIMIT: 1000
  THROTTLE_REPORTS_TTL_MS: 60000
  THROTTLE_REPORTS_LIMIT: 1000
  HTTP_JSON_BODY_LIMIT: 1mb
  HTTP_JSON_MAX_DEPTH: 10
  WS_MAX_CONNECTIONS_PER_USER: 5
  WS_MAX_EVENTS_PER_SECOND: 30
  WS_IDLE_TIMEOUT_MS: 60000
  SECURITY_ALERT_401_403_THRESHOLD: 50

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quantia
          POSTGRES_PASSWORD: quantia
          POSTGRES_DB: quantia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantia -d quantia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: SCA — direct dependency audit
        run: npm run audit:ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: E2E tests
        run: npm run test:e2e

      - name: Docker build
        run: docker build -t quantia-api:ci .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: quantia-api:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          vuln-type: os
          ignore-unfixed: true
